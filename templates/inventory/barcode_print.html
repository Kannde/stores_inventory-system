<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barcode — {{ product.name }}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #fff; }
  .controls { padding: 16px; display: flex; gap: 8px; align-items: center; background: #f5f5f5; border-bottom: 1px solid #ddd; }
  .controls label { font-size: 13px; }
  .controls input { width: 60px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  .btn { padding: 6px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .btn-primary { background: #2d6a4f; color: #fff; }
  .btn-outline { background: transparent; border: 1px solid #ccc; }
  .grid { padding: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .label-card { border: 1px dashed #ccc; border-radius: 6px; padding: 8px 12px; text-align: center; display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
  .label-card .name { font-size: 11px; font-weight: 600; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .label-card .price { font-size: 13px; font-weight: 700; color: #2d6a4f; }
  .label-card .code { font-size: 9px; color: #888; }
  @media print {
    .controls { display: none; }
    .grid { padding: 4mm; gap: 4mm; }
    .label-card { border: 1px solid #ccc; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<div class="controls">
  <label>Copies:</label>
  <input type="number" id="qtyInput" value="{{ qty|length }}" min="1" max="100">
  <button class="btn btn-primary" onclick="renderLabels()">Update</button>
  <button class="btn btn-outline" onclick="window.print()">🖨 Print</button>
  <a href="{% url 'inventory:product_edit' store.slug product.pk %}" style="margin-left:auto;font-size:13px;color:#2d6a4f">← Back to Product</a>
</div>
<div class="grid" id="labelGrid"></div>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script>
const BARCODE = "{{ product.barcode }}";
const NAME = "{{ product.name|escapejs }}";
const PRICE = "{{ store.currency_symbol }}{{ product.unit_price }}";

function renderLabels() {
  const qty = parseInt(document.getElementById('qtyInput').value) || 1;
  const grid = document.getElementById('labelGrid');
  grid.innerHTML = '';
  for (let i = 0; i < qty; i++) {
    const card = document.createElement('div');
    card.className = 'label-card';
    card.innerHTML = `
      <div class="name">${NAME}</div>
      <svg class="bc"></svg>
      <div class="price">${PRICE}</div>
      <div class="code">${BARCODE}</div>
    `;
    grid.appendChild(card);
    JsBarcode(card.querySelector('.bc'), BARCODE, {
      format: "CODE128", lineColor: "#000", width: 1.5, height: 40, displayValue: false, margin: 2
    });
  }
}
renderLabels();
</script>
</body>
</html>
