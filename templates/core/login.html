{% extends 'base.html' %}
{% block title %}SalesApp - Login{% endblock %}
{% block content %}
<div class="container" style="min-height:100dvh;display:flex;align-items:center;justify-content:center">
  <div style="width:100%;max-width:420px">
    <div style="text-align:center;margin-bottom:18px">
      <div style="font-size:34px;font-weight:700;color:var(--accent)">SalesApp</div>
      <p style="color:var(--text-3);font-size:14px;margin-top:6px">Store owners and sales staff sign in here. Superusers land on the admin overview.</p>
    </div>

    <form method="post" class="card" style="padding:20px">
      {% csrf_token %}
      {% if form.non_field_errors %}
      <div class="alert error" style="margin-bottom:14px">{{ form.non_field_errors|join:', ' }}</div>
      {% endif %}

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" required value="{{ form.username.value|default:'' }}" autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
  </div>
</div>
{% endblock %}
