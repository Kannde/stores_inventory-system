services:
  db:
    image: postgres:16-alpine
    hostname: stores-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stores_inventory_system}
      POSTGRES_USER: ${POSTGRES_USER:-stores_inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stores_inventory}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stores_inventory} -d ${POSTGRES_DB:-stores_inventory_system}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-stores_inventory_system}
      DB_USER: ${POSTGRES_USER:-stores_inventory}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-stores_inventory}
      DB_HOST: stores-db
      DB_PORT: 5432
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    networks:
      - default
      - app_default

volumes:
  postgres_data:
  media_files:
  static_files:

networks:
  app_default:
    external: true
